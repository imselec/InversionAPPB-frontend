<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./pwa-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F1117" />
    <meta name="description" content="Monthly Investment Advisor - Portfolio tracking and recommendations" />
    <title>InversionAPP</title>
    <script>
      // Unregister ALL service workers — they crash in Capacitor WebView
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
        }).catch(function(){});
        // Also prevent any new SW registration
        var _orig = navigator.serviceWorker.register.bind(navigator.serviceWorker);
        navigator.serviceWorker.register = function() { return Promise.reject(new Error('SW disabled')); };
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
